<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--TITULO--></title>
<style>
  :root { --fondo:#0b0d12; --tinta:#eef1f5; --suave:#98a2b0; --borde:#2a303b; --boton:#171b23; --activo:#f2b84b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--fondo); color:var(--tinta);
         font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  main { max-width: 1320px; margin: 0 auto; padding: 14px 16px 28px; }
  canvas#escena { width:100%; height:auto; display:block; border-radius:10px; background:#000; }
  .barra { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:12px; }
  button, select { font: inherit; font-size:15px; color:var(--tinta); background:var(--boton);
           border:1px solid var(--borde); border-radius:8px; padding:7px 12px; cursor:pointer; min-height:38px; }
  button:hover { border-color: var(--activo); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid var(--activo); outline-offset:2px; }
  button.principal { background:var(--activo); border-color:var(--activo); color:#14161c; font-weight:700; min-width:112px; }
  button.grabando { background:#d64545; border-color:#d64545; color:#fff; }
  input[type=range] { flex:1 1 220px; min-width:140px; accent-color: var(--activo); }
  label { font-size:14px; color:var(--suave); }
  .ayuda { margin-top:10px; font-size:13.5px; color:var(--suave); line-height:1.5; }
  kbd { border:1px solid var(--borde); border-radius:4px; padding:0 5px; font-size:12px; background:var(--boton); }
</style>
</head>
<body>
<main>
  <canvas id="escena" width="1920" height="1080" aria-label="Película de la búsqueda"></canvas>
  <div class="barra">
    <button id="capAtras" title="Capítulo anterior">⏮ Capítulo</button>
    <button id="atras" title="Un evento atrás">◀ Paso</button>
    <button id="play" class="principal">▶ Reproducir</button>
    <button id="adelante" title="Un evento adelante">Paso ▶</button>
    <button id="capAdelante" title="Capítulo siguiente">Capítulo ⏭</button>
    <button id="azar" title="Saltar a un evento cualquiera de este capítulo y pausar">Al azar</button>
    <label for="vel">Velocidad</label>
    <select id="vel"></select>
    <input id="tiempo" type="range" min="0" max="1" value="0" step="1" aria-label="Posición en el capítulo">
    <button id="grabar" title="Graba la película desde el comienzo y descarga el video">● Grabar video</button>
  </div>
  <p class="ayuda">Al pausar aparecen el número del evento, la pila y los contadores. <kbd>espacio</kbd> pausa, <kbd>←</kbd> <kbd>→</kbd> avanzan un evento.</p>
</main>
<script>/*THREE*/</script>
<script>
"use strict";
const D = /*DATOS*/;
const COLOR = ["#4fd08a", "#ff5d5d", "#5aa2ff", "#b184ff", "#ffa94d", "#ffd23f"];
const VERBO = ["AVANZA", "TROPIEZA", "DEDUCE", "PODA", "RETROCEDE", "SOLUCIÓN"];
const ROTULO = ["pasos", "tropiezos", "deducciones", "podas", "retrocesos", "soluciones"];
const W = 1280, H = 720, ESC = 1.5;
const FUENTE = 'system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif';
const lienzo = document.getElementById("escena"), g = lienzo.getContext("2d");
const [NF, NC] = D.fijo.n, CUEVA = D.fijo.a === "cueva", SALA = D.fijo.a === "sala";
const ROSA = "#ff8a1e";                 // el color del hilo de Pixie y de su nombre (naranja)

// azar repetible: la misma cueva se ve igual cada vez
function azar(f, c, k) { const x = Math.sin(f * 127.1 + c * 311.7 + k * 74.7) * 43758.5453; return x - Math.floor(x); }

// ====================================================================== la escena 3D
const render = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
render.setSize(W * ESC, H * ESC, false);
render.shadowMap.enabled = true; render.shadowMap.type = THREE.PCFSoftShadowMap;
render.toneMapping = THREE.ACESFilmicToneMapping; render.toneMappingExposure = CUEVA ? 1.0 : SALA ? 0.95 : 0.82;
const CIELO = CUEVA ? "#05070c" : SALA ? "#dfdee8" : "#20242e";
render.setClearColor(CIELO);
const escena = new THREE.Scene();
escena.fog = CUEVA ? new THREE.FogExp2("#05070c", 0.036) : new THREE.Fog(CIELO, 40, 90);
const camara = new THREE.PerspectiveCamera(CUEVA ? 30 : SALA ? 28 : 26, W / H, 0.5, 200);
const mira = new THREE.Vector3(NC / 2 + (CUEVA ? 0 : -Math.max(NF, NC) * 0.16), 0, NF / 2 + (CUEVA ? 0 : 0.3)), miraMeta = mira.clone();
const lado = Math.max(NF, NC);
const BRAZO = CUEVA ? new THREE.Vector3(0.9, 9.4, 6.4) : SALA ? new THREE.Vector3(lado * 0.4, lado * 1.5 + 3.4, lado * 1.08 + 2.6) : new THREE.Vector3(lado * 0.7, lado * 1.55, lado * 1.45);

const tapa = (c, o) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.9, metalness: 0.0, flatShading: true }, o || {}));
function pieza(geo, material, x, y, z, sombra) {
  const m = new THREE.Mesh(geo, typeof material === "string" ? tapa(material) : material); m.position.set(x, y, z);
  m.castShadow = sombra !== false; m.receiveShadow = true; return m;
}
const caja = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const cil = (r1, r2, h, n) => new THREE.CylinderGeometry(r1, r2, h, n || 20);
const bola = (r, a, b) => new THREE.SphereGeometry(r, a || 20, b || 14);

function texturaBrillo(color) {
  const c = document.createElement("canvas"); c.width = c.height = 128; const x = c.getContext("2d");
  const gr = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, color); gr.addColorStop(0.35, color + "88"); gr.addColorStop(1, color + "00");
  x.fillStyle = gr; x.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c);
}
const BRILLOS = {};
function brillo(color, tam, x, y, z, opacidad) {
  if (!BRILLOS[color]) BRILLOS[color] = texturaBrillo(color);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: BRILLOS[color], blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: opacidad == null ? 1 : opacidad }));
  s.scale.set(tam, tam, 1); s.position.set(x, y, z); return s;
}
function letrero(texto, color, px) {
  const c = document.createElement("canvas"); c.width = 512; c.height = 128; const x = c.getContext("2d");
  x.font = "800 " + px + "px " + FUENTE; x.fillStyle = color; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(texto, 256, 66);
  return new THREE.CanvasTexture(c);
}

// ---- luces ----
let farol = null;
if (CUEVA) {
  escena.add(new THREE.HemisphereLight("#8399dd", "#10121a", 1.25));
  const luna = new THREE.DirectionalLight("#8fa8ff", 1.1); luna.position.set(-6, 14, -4); escena.add(luna);
  farol = new THREE.PointLight("#ffb561", 40, 14, 1.4); farol.castShadow = true; farol.shadow.mapSize.set(1024, 1024);
  farol.shadow.bias = -0.002; farol.shadow.radius = 5; escena.add(farol);
} else if (SALA) {                       // luz de estudio: brillante, neutra, sombras grises y suaves
  escena.add(new THREE.HemisphereLight("#ffffff", "#c9ccd6", 2.3));
  const sol = new THREE.DirectionalLight("#ffffff", 1.5); sol.position.set(NC / 2 - 5, 15, NF / 2 + 7); sol.target.position.set(NC / 2, 0, NF / 2);
  sol.castShadow = true; sol.shadow.mapSize.set(2048, 2048); const sc = sol.shadow.camera;
  sc.left = -lado; sc.right = lado; sc.top = lado; sc.bottom = -lado; sc.near = 1; sc.far = 60; sol.shadow.radius = 7; sol.shadow.bias = -0.0006;
  escena.add(sol); escena.add(sol.target);
} else {
  escena.add(new THREE.HemisphereLight("#ffffff", "#7f8aa0", 0.95));
  const sol = new THREE.DirectionalLight("#fff0d2", 2.1); sol.position.set(NC / 2 + 7, 16, NF / 2 - 5); sol.target.position.set(NC / 2, 0, NF / 2);
  sol.castShadow = true; sol.shadow.mapSize.set(2048, 2048); const sc = sol.shadow.camera;
  sc.left = -lado; sc.right = lado; sc.top = lado; sc.bottom = -lado; sc.near = 1; sc.far = 60; sol.shadow.radius = 5; sol.shadow.bias = -0.0005;
  escena.add(sol); escena.add(sol.target);
}

// ---- lo que no cambia ----
const HUECOS = new Set(), animados = [];
const liso = c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.7, metalness: 0 });
function conBorde(malla) {               // el contorno negro fino de las piezas blancas
  const l = new THREE.LineSegments(new THREE.EdgesGeometry(malla.geometry), new THREE.LineBasicMaterial({ color: "#1b1c20" })); malla.add(l); return malla;
}
function rayas(c1, c2) {
  const c = document.createElement("canvas"); c.width = c.height = 128; const x = c.getContext("2d"); x.fillStyle = c1; x.fillRect(0, 0, 128, 128); x.strokeStyle = c2; x.lineWidth = 13;
  for (let k = -128; k < 256; k += 32) { x.beginPath(); x.moveTo(k, 128); x.lineTo(k + 128, 0); x.stroke(); } return new THREE.CanvasTexture(c);
}
function azulejos(color, nx, ny) {
  const c = document.createElement("canvas"); c.width = 64 * nx; c.height = 64 * ny; const x = c.getContext("2d"); x.fillStyle = color; x.fillRect(0, 0, c.width, c.height);
  x.strokeStyle = "rgba(255,255,255,0.22)"; x.lineWidth = 2; for (let a = 0; a <= nx; a++) { x.beginPath(); x.moveTo(a * 64, 0); x.lineTo(a * 64, c.height); x.stroke(); }
  for (let b = 0; b <= ny; b++) { x.beginPath(); x.moveTo(0, b * 64); x.lineTo(c.width, b * 64); x.stroke(); } return new THREE.CanvasTexture(c);
}
const paneles = [];                      // los contadores de siete segmentos colgados en la pared
function siete(x, n, cx, cy, h) {        // dibuja el numero n centrado en (cx, cy) con digitos de alto h
  const SEG = ["abcdef", "bc", "abged", "abgcd", "fgbc", "afgcd", "afgedc", "abc", "abcdefg", "abcdfg"], t = String(n), w = h * 0.52, sep = h * 0.2, g = h * 0.11;
  let x0 = cx - (t.length * w + (t.length - 1) * sep) / 2; x.fillStyle = "#ffffff";
  for (const d of t) { const s = SEG[+d] || ""; const y0 = cy - h / 2, H2 = h / 2;
    const r = (a, b, c, e) => x.fillRect(x0 + a, y0 + b, c, e);
    if (s.includes("a")) r(g, 0, w - 2 * g, g); if (s.includes("g")) r(g, H2 - g / 2, w - 2 * g, g); if (s.includes("d")) r(g, h - g, w - 2 * g, g);
    if (s.includes("f")) r(0, g, g, H2 - 1.5 * g); if (s.includes("b")) r(w - g, g, g, H2 - 1.5 * g);
    if (s.includes("e")) r(0, H2 + g / 2, g, H2 - 1.5 * g); if (s.includes("c")) r(w - g, H2 + g / 2, g, H2 - 1.5 * g);
    x0 += w + sep; }
}
function panelPared(xc, y, ancho, alto, rotulo) {
  const c = document.createElement("canvas"); c.width = 256; c.height = Math.round(256 * alto / ancho); const t = new THREE.CanvasTexture(c);
  const m = new THREE.Mesh(caja(ancho, alto, 0.08), [0, 1, 2, 3, 4, 5].map(k => k === 4 ? new THREE.MeshBasicMaterial({ map: t }) : new THREE.MeshBasicMaterial({ color: "#0c0d10" })));
  m.position.set(xc, y, 0.02); escena.add(m); const P = { lienzo: c, tex: t, valor: -1, rotulo: rotulo }; paneles.push(P); return P;
}
function pintaPanel(P, n) {
  if (P.valor === n) return; P.valor = n; const x = P.lienzo.getContext("2d"), w = P.lienzo.width, h = P.lienzo.height;
  x.fillStyle = "#0c0d10"; x.fillRect(0, 0, w, h); siete(x, n, w / 2, h * 0.46, h * 0.56);
  x.fillStyle = "rgba(255,255,255,0.7)"; x.font = "700 " + Math.round(h * 0.13) + "px " + FUENTE; x.textAlign = "center"; x.fillText(P.rotulo, w / 2, h * 0.93); P.tex.needsUpdate = true;
}
let panelArriba = null, panelAbajo = null;
if (SALA) {
  // la sala es una losa que flota: piso de baldosas oscuras con junta blanca y canto grueso
  escena.add(pieza(caja(NC + 0.04, 0.9, NF + 0.04), liso("#4b4c50"), NC / 2, -0.46, NF / 2));
  escena.add(pieza(caja(NC, 0.04, NF), liso("#f4f4f6"), NC / 2, 0.012, NF / 2, false));
  // dos paredes altas al fondo, del color de este mundo, con azulejos
  const alto = 2.9, cp = D.fijo.w || "#4061B0";
  const pn = pieza(caja(NC + 0.5, alto + 0.9, 0.5), new THREE.MeshStandardMaterial({ map: azulejos(cp, NC, 4), roughness: 0.8 }), NC / 2 - 0.25, alto / 2 - 0.46, -0.25); escena.add(pn);
  const po = pieza(caja(0.5, alto + 0.9, NF), new THREE.MeshStandardMaterial({ map: azulejos(cp, NF, 4), roughness: 0.8 }), -0.25, alto / 2 - 0.46, NF / 2); escena.add(po);
  panelArriba = panelPared(NC / 2 - 1.15, 1.75, 2.0, 1.25, "TROPIEZOS"); panelAbajo = panelPared(NC / 2 + 1.15, 1.75, 2.0, 1.25, "PASOS");
}
const fondoMundo = pieza(caja(NC + 60, 0.4, NF + 60), CUEVA ? "#07090d" : "#2a2f3b", NC / 2, CUEVA ? -2.6 : -0.32, NF / 2, false); if (!SALA) escena.add(fondoMundo);
if (!CUEVA && !SALA) escena.add(pieza(caja(NC + 0.9, 0.5, NF + 0.9), "#f3efe8", NC / 2, -0.27, NF / 2));

function mueble(tipo, color) {
  const G = new THREE.Group(); const pon = (geo, col, x, y, z) => { const m = pieza(geo, col, x, y, z); G.add(m); return m; };
  if (tipo === "cama") { pon(caja(0.8, 0.26, 0.9), color, 0, 0.13, 0); pon(caja(0.74, 0.1, 0.84), "#f3efe6", 0, 0.31, 0); pon(caja(0.5, 0.1, 0.24), "#ffffff", 0, 0.4, -0.27); }
  else if (tipo === "mesa") { pon(caja(0.84, 0.08, 0.84), color, 0, 0.5, 0); for (const [a, b] of [[-1,-1],[1,-1],[-1,1],[1,1]]) pon(caja(0.08, 0.46, 0.08), color, a * 0.34, 0.23, b * 0.34); }
  else if (tipo === "planta") { pon(cil(0.24, 0.18, 0.3, 8), "#b5653a", 0, 0.15, 0); pon(new THREE.IcosahedronGeometry(0.34, 0), color, 0, 0.6, 0); pon(new THREE.IcosahedronGeometry(0.22, 0), color, 0.14, 0.86, 0.05); }
  else if (tipo === "estufa") { pon(caja(0.84, 0.6, 0.84), color, 0, 0.3, 0); pon(caja(0.86, 0.05, 0.86), "#2b2f3a", 0, 0.625, 0); for (const [a, b] of [[-1,-1],[1,-1],[-1,1],[1,1]]) pon(cil(0.12, 0.12, 0.03), "#e25555", a * 0.2, 0.66, b * 0.2); }
  else if (tipo === "piano") { pon(caja(0.9, 0.62, 0.5), color, 0, 0.31, -0.12); pon(caja(0.9, 0.08, 0.26), color, 0, 0.42, 0.24); pon(caja(0.8, 0.03, 0.18), "#ffffff", 0, 0.475, 0.26); }
  else if (tipo === "fuente") { pon(cil(0.44, 0.46, 0.24, 10), "#c9c2b4", 0, 0.12, 0); pon(cil(0.36, 0.36, 0.05, 10), color, 0, 0.25, 0); pon(cil(0.07, 0.09, 0.5, 8), "#c9c2b4", 0, 0.37, 0); }
  else if (tipo === "barril") { pon(cil(0.3, 0.3, 0.66, 10), color, 0, 0.33, 0); pon(cil(0.315, 0.315, 0.05, 10), "#3b3f48", 0, 0.16, 0); pon(cil(0.315, 0.315, 0.05, 10), "#3b3f48", 0, 0.5, 0); }
  else if (tipo === "telar") { pon(caja(0.08, 0.8, 0.08), color, -0.36, 0.4, 0); pon(caja(0.08, 0.8, 0.08), color, 0.36, 0.4, 0); pon(caja(0.8, 0.08, 0.08), color, 0, 0.78, 0); pon(caja(0.66, 0.5, 0.03), "#d9486e", 0, 0.45, 0); }
  else pon(caja(0.7, 0.6, 0.7), color, 0, 0.3, 0);
  return G;
}

for (const c of D.fijo.c) {
  const f = c[1], k = c[2];
  if (SALA && c[0] === "p") { escena.add(pieza(caja(0.955, 0.06, 0.955), liso(c[3] || "#5a5b5f"), k + 0.5, 0.02, f + 0.5, false)); }
  else if (SALA && c[0] === "q") { escena.add(conBorde(pieza(caja(1.0, 0.95, 1.0), liso("#f1f2f4"), k + 0.5, 0.05 + 0.475, f + 0.5))); }
  else if (SALA && c[0] === "u") {
    HUECOS.add(f + "," + k); escena.add(pieza(caja(0.955, 0.02, 0.955), new THREE.MeshBasicMaterial({ color: "#08090b" }), k + 0.5, 0.036, f + 0.5, false));
    const marco = new THREE.Mesh(new THREE.PlaneGeometry(0.955, 0.955), new THREE.MeshBasicMaterial({ map: rayas("#ffc400", "#17181c") })); marco.rotation.x = -Math.PI / 2; marco.position.set(k + 0.5, 0.047, f + 0.5); escena.add(marco);
    const negro = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 0.7), new THREE.MeshBasicMaterial({ color: "#050506" })); negro.rotation.x = -Math.PI / 2; negro.position.set(k + 0.5, 0.049, f + 0.5); escena.add(negro);
  }
  else if (c[0] === "s") { const m = new THREE.Mesh(new THREE.PlaneGeometry(0.955, 0.955), new THREE.MeshBasicMaterial({ map: rayas("#3a3b3f", ROSA) })); m.rotation.x = -Math.PI / 2; m.position.set(k + 0.5, 0.053, f + 0.5); if (SALA) escena.add(m); }
  else if (c[0] === "g") { if (SALA) escena.add(pieza(caja(0.955, 0.05, 0.955), new THREE.MeshStandardMaterial({ color: "#8dff6b", emissive: "#3fae22", emissiveIntensity: 0.35 }), k + 0.5, 0.06, f + 0.5, false)); }
  else if (c[0] === "p") {
    const col = new THREE.Color(c[3]); if (CUEVA) col.offsetHSL(0, 0, (azar(f, k, 1) - 0.5) * 0.07);
    const alto = CUEVA ? 0.5 : 0.12, sube = CUEVA ? (azar(f, k, 2) - 0.5) * 0.06 : 0;
    const losa = pieza(caja(CUEVA ? 1.0 : 0.96, alto, CUEVA ? 1.0 : 0.96), tapa(col), k + 0.5, -alto / 2 + 0.05 + sube, f + 0.5, false); escena.add(losa);
    if (CUEVA && azar(f, k, 3) > 0.62) { const p = pieza(new THREE.DodecahedronGeometry(0.07 + azar(f, k, 4) * 0.06, 0), "#5b5046", k + 0.2 + azar(f, k, 5) * 0.6, 0.08, f + 0.2 + azar(f, k, 6) * 0.6); escena.add(p); }
  } else if (c[0] === "q") {
    const alto = 0.62 + azar(f, k, 8) * 0.16;
    const base = pieza(caja(1.0, alto + 0.5, 1.0), tapa(new THREE.Color("#454c5e").offsetHSL(0, 0, (azar(f, k, 9) - 0.5) * 0.05)), k + 0.5, (alto - 0.5) / 2 + 0.05, f + 0.5); escena.add(base);
    const n = 1 + Math.floor(azar(f, k, 7) * 2);
    for (let j = 0; j < n; j++) {
      const r = 0.2 + azar(f, k, 10 + j) * 0.16, tono = new THREE.Color("#515a70").offsetHSL(0, 0, (azar(f, k, 20 + j) - 0.5) * 0.08);
      const roca = pieza(new THREE.DodecahedronGeometry(r, 0), tapa(tono), k + 0.3 + azar(f, k, 30 + j) * 0.4, alto + 0.08, f + 0.3 + azar(f, k, 50 + j) * 0.4);
      roca.rotation.set(azar(f, k, 60 + j) * 3, azar(f, k, 70 + j) * 3, 0); escena.add(roca);
    }
    if (azar(f, k, 90) > 0.8) {                                  // un cristal que brilla
      const tinte = azar(f, k, 91) > 0.5 ? "#59e0ff" : "#c57bff";
      const cr = pieza(new THREE.OctahedronGeometry(0.13, 0), new THREE.MeshStandardMaterial({ color: tinte, emissive: tinte, emissiveIntensity: 2.2, flatShading: true }), k + 0.5, 1.02, f + 0.5, false);
      cr.scale.y = 2.1; escena.add(cr); escena.add(brillo(tinte, 2.0, k + 0.5, 1.05, f + 0.5, 0.5));
    }
  } else if (c[0] === "u") {
    HUECOS.add(f + "," + k);
    escena.add(pieza(caja(1.0, 0.1, 1.0), "#020305", k + 0.5, -2.2, f + 0.5, false));
    const niebla = brillo("#3b8bff", 2.6, k + 0.5, -0.1, f + 0.5, 0.7); escena.add(niebla); animados.push({ tipo: "late", obj: niebla, fase: azar(f, k, 3) * 6, base: 0.7 });
    const borde = new THREE.Mesh(new THREE.TorusGeometry(0.46, 0.03, 6, 4), new THREE.MeshBasicMaterial({ color: "#2f6fe0" })); borde.rotation.x = Math.PI / 2; borde.rotation.z = Math.PI / 4; borde.position.set(k + 0.5, 0.02, f + 0.5); escena.add(borde);
  } else if (c[0] === "m") {

}

function pinta(dt) {
  const p = CAPS[cap], ev = eventoActual(), cuadro = ev ? D.cuadros[ev[1]] : null;
  animaTodo(dt, Math.max(0.06, Math.min(0.5, 0.8 / porSegundo)));
  render.render(escena, camara);
  g.setTransform(ESC, 0, 0, ESC, 0, 0);
  g.drawImage(render.domElement, 0, 0, W, H);
  if (FILTRO) {                                               // resplandor: la misma imagen, borrosa, sumada encima
    gp.filter = "blur(6px) brightness(1.1) contrast(1.35)"; gp.drawImage(render.domElement, 0, 0, 480, 270); gp.filter = "none";
    g.globalCompositeOperation = "lighter"; g.globalAlpha = CUEVA ? 0.22 : SALA ? 0 : 0.07; g.drawImage(pequeno, 0, 0, W, H); g.globalAlpha = 1; g.globalCompositeOperation = "source-over";
  }
  const vi = g.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95); vi.addColorStop(0, "rgba(0,0,0,0)"); vi.addColorStop(1, CUEVA ? "rgba(0,0,0,0.62)" : SALA ? "rgba(0,0,0,0.16)" : "rgba(0,0,0,0.5)");
  g.fillStyle = vi; g.fillRect(0, 0, W, H);
  if (ev && ev[0] === 1) { g.fillStyle = "rgba(255,40,40," + (0.16 * Math.max(0, 1 - (protagonista ? protagonista.t : 1))) + ")"; g.fillRect(0, 0, W, H); }

  // arriba a la izquierda: donde estamos
  const detalle = !andando;                               // en reproduccion solo se ve lo que importa; al pausar, todo
  if (detalle) { letra(D.titulo.toUpperCase(), 34, 40, 15, SALA ? "#ffffff" : "rgba(255,255,255,0.72)", 700); letra(p.nombre, 34, 70, 30, "#ffffff", 800); }
  else letra(p.nombre, 34, 40, 19, "#ffffff", 700);
  // arriba a la derecha: los numeros que importan
  const cuenta = p.acum[i], muestra = SALA ? [2, 3] : [1, 0, 2, 3];
  if (SALA) { pintaPanel(panelArriba, cuenta[1]); pintaPanel(panelAbajo, cuenta[0]); }
  let x = W - 34;
  for (const t of (detalle ? muestra : []).slice().reverse()) {
    if (p.cuenta[t] === 0 && CAPS.every(q => q.cuenta[t] === 0)) continue;
    letra(ROTULO[t].toUpperCase(), x, 36, 12, "rgba(255,255,255,0.7)", 700, "right");
    letra(miles(cuenta[t]), x, 66, t === 1 ? 40 : 30, COLOR[t], 800, "right");
    g.font = "700 12px " + FUENTE; x -= Math.max(g.measureText(ROTULO[t].toUpperCase()).width, 54) + 30;
  }
  // el hilo (la pila), abajo a la izquierda
  const prof = ev ? ev[2] : 0, np = PILA, bw = Math.max(3, Math.min(14, 330 / np - 2));
  if (detalle) letra("PILA  " + prof, 34, H - 62, 12, "rgba(255,255,255,0.7)", 700);
  for (let j = 0; j < (detalle ? np : 0); j++) { g.fillStyle = j < prof ? "#ffcf5a" : "rgba(255,255,255,0.16)"; g.fillRect(34 + j * (bw + 2), H - 46, bw, 9); }
  if (detalle) letra(p.recortada ? "primeros " + miles(p.ev.length) + " de " + miles(p.total) + " eventos" : "evento " + miles(i) + " de " + miles(p.total), 34, H - 22, 12.5, "rgba(255,255,255,0.6)", 400);
  // el panel del mundo, si lo hay
  const panel = cuadro && cuadro.p;
  if (panel) {
    let yy = 130; letra(panel[0].toUpperCase(), 34, yy - 24, 12, "rgba(255,255,255,0.7)", 700);
    for (const L of panel.slice(1)) { const rs = renglones(L[0], 300, 14, L[2] ? 700 : 400); if (yy > H - 130) break;
      g.fillStyle = L[1] === "bien" ? COLOR[0] : L[1] === "mal" ? COLOR[1] : "rgba(255,255,255,0.3)"; g.beginPath(); g.arc(40, yy, 4.5, 0, 2 * Math.PI); g.fill();
      rs.forEach((r, k) => letra(r, 54, yy + k * 18, 14, L[2] ? "#ffffff" : "rgba(255,255,255,0.82)", L[2] ? 700 : 400)); yy += rs.length * 18 + 8; }
  }
  // el subtitulo: lo que acaba de pasar
  if (ev && !narra && (detalle || ev[0] === 1 || ev[0] === 2 || ev[0] === 3 || ev[0] === 5)) {
    const texto = (detalle || ev[0] !== 5) ? (ev[3] || "") : "", px = detalle ? 22 : 19; g.font = "800 15px " + FUENTE; const av = g.measureText(VERBO[ev[0]]).width + 26;
    g.font = "500 " + px + "px " + FUENTE; const at = texto ? g.measureText(texto).width + 18 : 0, ancho = Math.min(W - 420, av + at + 30), x0 = W / 2 - ancho / 2, y0 = H - 74;
    tarjeta(x0, y0, ancho, 48, 24, "rgba(8,10,14,0.72)");
    tarjeta(x0 + 9, y0 + 9, av, 30, 15, COLOR[ev[0]]); letra(VERBO[ev[0]], x0 + 9 + av / 2, y0 + 25, 15, "#0b0d12", 800, "center", false);
    if (texto) { let t = texto; g.font = "500 " + px + "px " + FUENTE; while (t.length > 1 && g.measureText(t).width > ancho - av - 40) t = t.slice(0, -2) + "…"; letra(t, x0 + av + 22, y0 + 25, px, "#ffffff", 500, "left", false); }
  }
  const m = cuadro && cuadro.m;                                 // el medidor del mundo (aceite, combustible...)
  if (m) { const an = 190, x0 = W - 34 - 190, lleno = Math.max(0, Math.min(1, m[1] / m[2]));
    letra(m[0].toUpperCase() + (detalle ? "  " + m[1] : ""), x0, H - 62, 12, "rgba(255,255,255,0.7)", 700);
    g.fillStyle = "rgba(255,255,255,0.16)"; g.fillRect(x0, H - 46, an, 9); g.fillStyle = lleno > 0.25 ? "#ffa94d" : "#ff5d5d"; g.fillRect(x0, H - 46, an * lleno, 9); }
  // el narrador: su texto aparece letra por letra
  const L = lineaNarrador(), dicho = narra ? narra.texto : (L && !andando ? L[0] : null);
  if (dicho) {                                          // cajas negras ajustadas al texto, cerca de Pixie, con palabras clave en color
    const px = 25, rs = renglones(dicho, 700, px, 600);
    let quedan = narra ? Math.ceil(dicho.length * Math.min(1, narra.t / Math.max(0.6, narra.dura * 0.55))) : dicho.length;
    let ax = W / 2, ay = H - 150 - rs.length * 38;
    if (SALA && protagonista) { const v = protagonista.grupo.position.clone(); v.y += 1.7; v.project(camara);
      ax = Math.max(390, Math.min(W - 390, (v.x + 1) / 2 * W)); ay = Math.max(120, Math.min(H - 210, (1 - v.y) / 2 * H - rs.length * 38 - 6)); }
    rs.forEach((r, k) => { const parte = r.slice(0, Math.max(0, quedan)); quedan -= r.length + 1; if (!parte) return;
      g.font = "600 " + px + "px " + FUENTE; const x0 = ax - g.measureText(r).width / 2, y = ay + k * 38;
      g.fillStyle = "rgba(0,0,0,0.84)"; g.fillRect(x0 - 9, y - 18, g.measureText(parte).width + 18, 36);
      let x = x0; g.textAlign = "left"; g.textBaseline = "middle";
      for (const pal of parte.split(" ")) { g.fillStyle = CLAVE[pal.toLowerCase().replace(/[.,:;!?¿¡]/g, "")] || "#ffffff"; g.fillText(pal, x, y + 1); x += g.measureText(pal + " ").width; } });
  }
  if (cuadro && cuadro.v) { g.font = "800 30px " + FUENTE; const an = g.measureText(cuadro.v).width + 64; tarjeta(W / 2 - an / 2, 118, an, 62, 31, COLOR[5]); letra(cuadro.v, W / 2, 150, 30, "#14161c", 800, "center", false); }
  if (cartel) pintaCartel();
  tiempo.max = p.ev.length; tiempo.value = i;
}

function pintaCartel() {
  enCartel = true;
  const a = Math.min(1, cartel.t / 0.3);
  g.fillStyle = "rgba(5,7,12," + (cartel.tipo === "capitulo" ? 0.66 * a : 0.86 * a) + ")"; g.fillRect(0, 0, W, H); g.globalAlpha = a;
  if (cartel.tipo === "portada") {
    letra(D.titulo, W / 2, 270, 64, "#ffffff", 800, "center");
    renglones(D.pregunta, 900, 26, 400).forEach((r, k) => letra(r, W / 2, 350 + k * 36, 26, COLOR[5], 500, "center"));
    letra(CAPS.length + " generaciones del mismo agente", W / 2, 470, 18, "rgba(255,255,255,0.65)", 400, "center");
  } else if (cartel.tipo === "capitulo") {
    const p = CAPS[cap]; letra(p.nombre, W / 2, 320, 56, "#ffffff", 800, "center");
    renglones(p.desc, 860, 23, 400).forEach((r, k) => letra(r, W / 2, 392 + k * 32, 23, "rgba(255,255,255,0.8)", 400, "center"));
  } else {
    letra("Lo que cambió entre generaciones", W / 2, 150, 40, "#ffffff", 800, "center");
    const cols = ["", "pasos", "tropiezos", "deducciones", "podas", "eventos"], x0 = 190, dx = [0, 400, 520, 650, 760, 900];
    cols.forEach((c, k) => letra(c.toUpperCase(), x0 + dx[k], 232, 13, "rgba(255,255,255,0.65)", 700, k ? "right" : "left"));
    CAPS.forEach((p, j) => { const y = 284 + j * 62; tarjeta(x0 - 22, y - 28, 950, 54, 12, "rgba(255,255,255,0.07)");
      letra(p.nombre, x0, y, 21, "#ffffff", 700);
      [p.cuenta[0], p.cuenta[1], p.cuenta[2], p.cuenta[3], p.total].forEach((v, k) => letra(miles(v), x0 + dx[k + 1], y, 22, k === 1 ? COLOR[1] : k === 4 ? COLOR[5] : "#ffffff", 800, "right")); });
    let res = ""; for (const p of CAPS) for (const e of p.ev) if (D.cuadros[e[1]].v) res = D.cuadros[e[1]].v;
    if (res) letra(res, W / 2, 300 + CAPS.length * 62 + 44, 30, COLOR[5], 800, "center");
  }
  g.globalAlpha = 1; enCartel = false;
}

// ---------- controles ----------
const play = document.getElementById("play"), tiempo = document.getElementById("tiempo"), vel = document.getElementById("vel"), grabar = document.getElementById("grabar");
for (const v of [1, 2, 3, 6, 12, 25, 60, 150]) { const o = document.createElement("option"); o.value = v; o.textContent = v + " por segundo"; vel.appendChild(o); }
if (![...vel.options].some(o => +o.value === porSegundo)) porSegundo = 3;
vel.value = porSegundo;
function muestra(instantaneo) { const ev = eventoActual(); if (ev) ponCuadro(D.cuadros[ev[1]], ev[0], instantaneo); else ponCuadro(D.cuadros[CAPS[cap].ev[0][1]], -1, true); }
function ir(n, instantaneo) { callaNarrador(); cartel = null; i = Math.max(0, Math.min(CAPS[cap].ev.length, n)); muestra(instantaneo !== false); }
function irCap(k) { callaNarrador(); cap = Math.max(0, Math.min(CAPS.length - 1, k)); i = 0;
  if (CAPS[cap].vel) { porSegundo = CAPS[cap].vel; if (![...vel.options].some(o => +o.value === porSegundo)) { const o = document.createElement("option"); o.value = porSegundo; o.textContent = porSegundo + " por segundo"; vel.appendChild(o); } vel.value = porSegundo; } limpiaActores(); muestra(true); if (protagonista) { mira.set(protagonista.hasta.x, 0, protagonista.hasta.z); miraMeta.copy(mira); } }
function pausa() { callaNarrador(); andando = false; play.textContent = "▶ Reproducir"; }
function arranca() {
  if (cartel && cartel.tipo === "final") { irCap(0); cartel = { tipo: "portada", t: 0 }; }
  if (cartel && cartel.tipo === "portada") cartel = { tipo: "capitulo", t: 0 };
  preparaAudio(); if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  andando = true; play.textContent = "⏸ Pausar"; deuda = 0; espera = 0;
}
function tic(ahora) {
  const dt = Math.min(0.1, (ahora - antes) / 1000); antes = ahora;
  if (cartel) cartel.t += dt;
  if (andando) {
    if (narra) { narra.t += dt; if (narra.t >= narra.dura) narra = null; }
    if (cartel && cartel.tipo === "capitulo") { if (cartel.t > 2.8) { cartel = null; espera = dispara(); } }
    else if (cartel && cartel.tipo === "final") { if (cartel.t > 6 && grabadora) detenerGrabacion(); }
    else if (espera > 0) espera -= dt;
    else {
      const p = CAPS[cap]; deuda += dt * porSegundo;
      while (deuda >= 1 && i < p.ev.length) { deuda -= 1; i++; muestra(porSegundo > 25);
        const habla = dispara(); if (habla) { espera = habla; deuda = 0; break; }
        if (p.ev[i - 1][0] === 5) { espera = 2.4; deuda = 0; break; }
        if (p.ev[i - 1][0] === 1 && porSegundo <= 12) { espera = 0.9; deuda = 0; break; } }
      if (i >= p.ev.length && espera <= 0) { if (cap < CAPS.length - 1) { irCap(cap + 1); cartel = { tipo: "capitulo", t: 0 }; } else { cartel = { tipo: "final", t: 0 }; if (!grabadora) pausa(); } }
    }
  }
  pinta(dt); requestAnimationFrame(tic);
}
play.onclick = () => andando ? pausa() : arranca();
document.getElementById("atras").onclick = () => { pausa(); ir(i - 1); };
document.getElementById("adelante").onclick = () => { pausa(); ir(i + 1, false); };
document.getElementById("capAtras").onclick = () => { pausa(); cartel = null; irCap(i > 0 ? cap : cap - 1); };
document.getElementById("capAdelante").onclick = () => { pausa(); cartel = null; irCap(cap + 1); };
document.getElementById("azar").onclick = () => { pausa(); ir(1 + Math.floor(Math.random() * CAPS[cap].ev.length)); };
vel.onchange = () => { porSegundo = +vel.value; };
tiempo.oninput = () => { pausa(); ir(+tiempo.value); };
document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
  if (e.key === " ") { e.preventDefault(); play.click(); } else if (e.key === "ArrowRight") { pausa(); ir(i + 1, false); } else if (e.key === "ArrowLeft") { pausa(); ir(i - 1); }
});
let grabadora = null, trozos = [];
function detenerGrabacion() { if (grabadora && grabadora.state !== "inactive") grabadora.stop(); pausa(); }
grabar.onclick = () => {
  if (grabadora) { detenerGrabacion(); return; }
  if (!lienzo.captureStream || !window.MediaRecorder) { grabar.textContent = "Este navegador no graba: use Chrome o Firefox"; return; }
  const tipo = ["video/webm;codecs=vp9", "video/webm", "video/mp4"].find(t => MediaRecorder.isTypeSupported(t)) || "";
  preparaAudio(); const flujo = lienzo.captureStream(30);
  if (salidaGrabacion) for (const pista of salidaGrabacion.stream.getAudioTracks()) flujo.addTrack(pista);
  trozos = []; grabadora = new MediaRecorder(flujo, tipo ? { mimeType: tipo, videoBitsPerSecond: 10e6 } : {});
  grabadora.ondataavailable = e => { if (e.data.size) trozos.push(e.data); };
  grabadora.onstop = () => { const b = new Blob(trozos, { type: grabadora.mimeType || "video/webm" }), a = document.createElement("a");
    a.href = URL.createObjectURL(b); a.download = "pelicula." + (b.type.includes("mp4") ? "mp4" : "webm"); a.click();
    grabadora = null; grabar.textContent = "● Grabar video"; grabar.classList.remove("grabando"); };
  pausa(); irCap(0); cartel = { tipo: "portada", t: 0 }; grabadora.start(); grabar.textContent = "■ Detener y descargar"; grabar.classList.add("grabando"); setTimeout(arranca, 2500);
};
preparaRastro();
irCap(0); cartel = { tipo: "portada", t: 0 };
try { preparaAudio(); } catch (e) {}          // las voces se decodifican desde ya; suenan cuando se reproduce
requestAnimationFrame(tic);
</script>
